<div class="max-w-md mx-auto bg-white border border-gray-200 rounded-lg shadow-sm p-6 mt-8">
  <h2 class="text-xl font-bold mb-6 text-gray-900">Cinépolis - Control de Boletos</h2>

  <form [formGroup]="form" (ngSubmit)="procesar()" class="space-y-4">
    <div>
      <label for="nombre" class="block mb-2 text-sm font-medium text-gray-900">Nombre del Comprador</label>
      <input type="text" id="nombre" class="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" formControlName="nombre">
      <div *ngIf="enviado && form.controls['nombre'].invalid" class="mt-1 text-xs text-red-600">
        El nombre es obligatorio.
      </div>
    </div>

    <div>
      <label for="compradores" class="block mb-2 text-sm font-medium text-gray-900">Cantidad de Compradores</label>
      <input type="number" id="compradores" class="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" formControlName="compradores">
      <div *ngIf="enviado && form.controls['compradores'].invalid" class="mt-1 text-xs text-red-600">
        Debe haber al menos 1 comprador.
      </div>
    </div>

    <div>
      <label for="tarjeta" class="block mb-2 text-sm font-medium text-gray-900">¿Cuenta con Tarjeta Cnépolis?</label>
      <select id="tarjeta" class="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" formControlName="tarjeta">
        <option value="si">Sí</option>
        <option value="no">No</option>
      </select>
    </div>

    <div>
      <label for="boletos" class="block mb-2 text-sm font-medium text-gray-900">Cantidad de Boletos</label>
      <input type="number" id="boletos" class="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" formControlName="boletos">
      <div *ngIf="enviado && form.controls['boletos'].invalid" class="mt-1 text-xs text-red-600">
        Debe comprar al menos 1 boleto.
      </div>
    </div>

    <div class="flex space-x-3 pt-2">
      <button type="submit" class="flex-1 text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 focus:outline-none">Procesar</button>
      <button type="button" class="flex-1 text-gray-900 bg-white border border-gray-300 focus:outline-none hover:bg-gray-100 focus:ring-4 focus:ring-gray-100 font-medium rounded-lg text-sm px-5 py-2.5" (click)="salir()">Limpiar</button>
    </div>
  </form>

  <div *ngIf="error" class="p-4 mt-4 text-sm text-red-800 rounded-lg bg-red-50" role="alert">
    {{ error }}
  </div>

  <div *ngIf="!error && enviado && form.valid" class="p-4 mt-4 text-sm text-green-800 rounded-lg bg-green-50 flex justify-between items-center" role="alert">
    <span class="font-medium">Total a Pagar:</span>
    <span class="text-lg font-bold">${{ total | number:'1.2-2' }}</span>
  </div>

  <button type="button"
    class="w-full mt-4 text-white bg-purple-700 hover:bg-purple-800 focus:ring-4 focus:ring-purple-300 font-medium rounded-lg text-sm px-5 py-2.5 focus:outline-none text-center"
    routerLink="/venta">
    Ver ventas guardadas
  </button>
</div>
