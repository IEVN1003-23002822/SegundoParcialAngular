<div class="max-w-2xl mx-auto p-6 bg-white rounded-lg shadow">
 
  <h1 class="text-3xl font-bold text-gray-900 mb-6">
   Lista Alumnos
  </h1>
 
  <form [formGroup]="formulario" (ngSubmit)="MuesraAlumno()">
 
    <!-- Matricula -->
    <div class="mb-5">
 
      <label
        for="Matricula"
        class="block mb-2 text-sm font-medium text-gray-900"
      >
        Matricula
      </label>
 
      <input
        type="text"
        id="Matricula"
        name="Matricula"
        formControlName="matricula"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
               focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Matricula"
      >

    
      <!-- Nombre -->
      <label
        for="name"
        class="block mb-2 text-sm font-medium text-gray-900"
      >
        Nombre
      </label>
 
      <input
        type="text"
        id="name"
        name="name"
        formControlName="nombre"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
               focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Nombre"
      >

      <!-- Correo -->
      <label
        for="name"
        class="block mb-2 text-sm font-medium text-gray-900"
      >
        Correo
      </label>
 
      <input
        type="text"
        id="name"
        name="name"
        formControlName="correo"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
               focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Correo"
      >

      <!-- Materia -->
      <label
        for="name"
        class="block mb-2 text-sm font-medium text-gray-900"
      >
        Materia
      </label>
 
      <input
        type="text"
        id="name"
        name="name"
        formControlName="materia"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
               focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Materia"
      >
 
      
 
    </div>
 
    <!-- Comentario -->
    <div class="mb-5">
 
      
      <!-- Error required -->
      <div
        *ngIf="
          formulario.get('matricula')?.touched &&
          formulario.get('matricula')?.errors?.['required']
        "
        class="p-4 mt-2 text-sm text-red-800 rounded-lg bg-red-50"
        role="alert"
      >
        This field is required.
      </div>
 
 
      <!-- Botón -->
      <div class="flex justify-end mt-5">
 
        <button
          type="submit"
          
          class="text-white bg-blue-700 hover:bg-blue-800
                 focus:ring-4 focus:outline-none focus:ring-blue-300
                 font-medium rounded-lg text-sm px-5 py-2.5
                 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Registrar
        </button>


        <button
          type="submit"
         
          class="text-white bg-blue-700 hover:bg-blue-800
                 focus:ring-4 focus:outline-none focus:ring-blue-300
                 font-medium rounded-lg text-sm px-5 py-2.5
                 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Cargar
        </button>
 
      </div>
 
    </div>
 
  </form>
  <h2>lista de Alumnos</h2>
  <h3>Matricual:{{nuevoAlumno.matricula}}</h3>
  <h3>Nombre:{{nuevoAlumno.nombre}}</h3>
  <h3>Correo:{{nuevoAlumno.correo}}</h3>
  <h3>Materia:{{nuevoAlumno.materia}}</h3>

</div>
